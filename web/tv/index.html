<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buzz Party</title>
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <main id="language" class="screen center chooser" hidden>
    <h1>Choose language · Vælg sprog</h1>
    <div id="tv-langs" class="langs"></div>
    <aside class="chooser-qr">
      <img id="lang-qr" alt="QR">
      <p class="url" id="lang-url"></p>
      <p class="hint">Scan with your phone · Scan med din telefon</p>
    </aside>
  </main>

  <main id="setup" class="screen" hidden>
    <h1 data-i18n="setup.title">Almost ready</h1>
    <ul id="problems"></ul>
    <p class="hint" data-i18n-html="setup.hint">The first time, macOS may ask to allow incoming network connections. Click <b>Allow</b> so phones can join.</p>
  </main>

  <main id="home" class="screen" hidden>
    <p id="home-hint" class="hint top"></p>
    <div id="carousel" class="carousel"></div>
    <h1 id="game-title" class="game-title"></h1>
    <p id="game-langs" class="game-langs"></p>
    <p id="home-error" class="error" hidden></p>
    <div id="players" class="players"></div>
    <aside class="join-box">
      <img id="qr" alt="Join QR code">
      <p class="join" data-i18n="join.scan">Scan to join</p>
      <p id="url" class="url"></p>
    </aside>
  </main>

  <main id="launching" class="screen center" hidden>
    <p class="big" id="launching-text"></p>
  </main>

  <main id="game" class="screen" hidden></main>

  <script src="/i18n.js"></script>
  <script src="sfx.js"></script>
  <script src="intro.js"></script>
  <script src="tv.js"></script>
</body>
</html>
