name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The two platforms Buzz Party supports. Windows is not supported yet.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests don't start Electron; skip its ~100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test

      - name: Build the key helper (Linux)
        if: runner.os == 'Linux'
        run: npm run build:helper:linux

      - name: Build the key helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:helper
